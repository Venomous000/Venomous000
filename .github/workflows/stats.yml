name: Update GitHub Stats
on:
  schedule:
    - cron: '0 */12 * * *' # Updates every 12 hours
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Top Languages SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Venomous000&layout=compact&theme=tokyonight&hide_border=true" > top-langs.svg
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update GitHub Stats" && git push)
